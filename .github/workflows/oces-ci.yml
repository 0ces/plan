# Fork CI: checks our rules and tests on every push/PR to main; builds and
# pushes images to our registry on tags like oces-v1.4.3-1.
# Images build only once the repo variable DOCKER_REGISTRY is set
# (plus secrets DOCKER_USERNAME / DOCKER_PASSWORD), same as culpacafe.
name: oces-ci

on:
  push:
    branches: [main]
    tags: ["oces-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upstream-edits check diffs against the upstream tag

      - name: Upstream edits are listed and marked
        run: scripts/oces/check-upstream-edits.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: AGPL header on our files
        run: |
          go install github.com/google/addlicense@v1.1.1
          files=$(git ls-files 'apps/api/plane/oces/*.py' 'apps/web/oces/*.ts' 'apps/web/oces/*.tsx' 'apps/live/src/oces/*.ts' 'apps/live/tests/oces/*.ts' 'packages/types/src/oces/*.ts' | grep -v '/migrations/' || true)
          [ -z "$files" ] || "$(go env GOPATH)/bin/addlicense" -check -f COPYRIGHT.txt $files

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U plane" --health-interval 5s --health-retries 10
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://plane:plane@localhost:5432/plane
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-not-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt
      - run: pip install -r requirements/test.txt
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: plane.settings.test
      - name: Fork tests
        run: python -m pytest plane/oces/tests -q -p no:cacheprovider --create-db

  images:
    if: startsWith(github.ref, 'refs/tags/oces-v') && vars.DOCKER_REGISTRY != ''
    needs: [checks, api-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: plan-backend
            context: apps/api
            file: apps/api/Dockerfile.api
          - name: plan-web
            context: .
            file: apps/web/Dockerfile.web
          - name: plan-live
            context: .
            file: apps/live/Dockerfile.live
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Default build args keep URLs relative, same as the official images.
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKER_REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ vars.DOCKER_REGISTRY }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_REGISTRY }}/${{ matrix.name }}:buildcache,mode=max
